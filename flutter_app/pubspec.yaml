name: dawenly_app
description: "دوّنلي — تطبيق إدارة الحياة واليوميات بالذكاء الاصطناعي (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  record: ^5.2.0
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  flutter_markdown: ^0.7.4
  google_fonts: ^6.2.1
  path_provider_android: 2.2.17

dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    - assets/illustrations/
